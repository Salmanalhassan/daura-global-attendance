<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Daura Global</title>

    <link
        rel="stylesheet"
        href="../assests/css/style.css"
    >

</head>


<body class="auth-page">


    <main class="auth-wrapper">


        <!-- =========================================
             BRAND SECTION
        ========================================== -->

        <section class="auth-brand">

            <a
                href="../index.html"
                class="auth-logo"
            >

                <img
                    src="../assests/images/logo.svg"
                    alt="Daura Global Logo"
                >

            </a>


            <div>

                <span class="brand-badge">
                    ADMIN PORTAL
                </span>


                <h1>
                    Daura Global
                </h1>


                <p>
                    SIWES Attendance Management System
                    for secure and reliable student
                    attendance management.
                </p>

            </div>


            <div class="auth-brand-footer">

                <span>
                    © Daura GlobalTECHNOLOGY
                </span>

            </div>

        </section>



        <!-- =========================================
             LOGIN CARD
        ========================================== -->

        <section class="auth-card-section">


            <div class="auth-card">


                <div class="auth-heading">

                    <span class="selection-badge">
                        SECURE ACCESS
                    </span>


                    <h2>
                        Admin Login
                    </h2>


                    <p>
                        Sign in to manage students,
                        schools, SIWES batches,
                        QR attendance and reports.
                    </p>

                </div>



                <!-- MESSAGE -->

                <div
                    id="loginMessage"
                    class="form-message"
                    style="display:none;"
                ></div>



                <!-- FORM -->

                <form id="adminLoginForm">


                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>


                        <div class="input-wrapper">

                            <span class="input-icon">
                                👤
                            </span>


                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter admin username"
                                autocomplete="username"
                                required
                            >

                        </div>

                    </div>



                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>


                        <div class="input-wrapper">

                            <span class="input-icon">
                                🔒
                            </span>


                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                                autocomplete="current-password"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                            >
                                Show
                            </button>

                        </div>

                    </div>



                    <button
                        type="submit"
                        class="primary-button"
                        id="loginButton"
                    >

                        <span>
                            Sign In
                        </span>

                        <span class="button-arrow">
                            →
                        </span>

                    </button>


                </form>



                <div class="auth-bottom">

                    <span>
                        Daura GlobalTECHNOLOGY
                    </span>


                    <a href="../index.html">
                        Back to Home
                    </a>

                </div>


            </div>


        </section>


    </main>



<script>

const API_URL = "/api";

const form = document.getElementById("adminLoginForm");

const message = document.getElementById("loginMessage");

const loginButton = document.getElementById("loginButton");

const passwordInput = document.getElementById("password");

const togglePassword = document.getElementById("togglePassword");



/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

togglePassword.addEventListener("click", () => {

    if (passwordInput.type === "password") {

        passwordInput.type = "text";

        togglePassword.textContent = "Hide";

    } else {

        passwordInput.type = "password";

        togglePassword.textContent = "Show";

    }

});



/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type = "error") {

    message.textContent = text;

    message.className = `form-message ${type}`;

    message.style.display = "block";

}



/* =========================================
   ADMIN LOGIN
========================================= */

form.addEventListener("submit", async (event) => {

    event.preventDefault();


    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;


    if (!username || !password) {

        showMessage(
            "Username and password are required."
        );

        return;

    }


    loginButton.disabled = true;

    loginButton.querySelector("span").textContent =
        "Signing in...";


    try {

        const response = await fetch(
            `${API_URL}/auth/login`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })
            }
        );


        const data = await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Login failed"
            );

        }



        /* =========================================
           IMPORTANT:
           SAVE ADMIN TOKEN
        ========================================== */

        localStorage.setItem(
            "daura_admin_token",
            data.token
        );


        localStorage.setItem(
            "daura_admin_user",
            JSON.stringify(data.user)
        );


        localStorage.setItem(
            "daura_role",
            "admin"
        );



        showMessage(
            "Login successful. Opening dashboard...",
            "success"
        );



        /* =========================================
           GO TO DASHBOARD
        ========================================== */

        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        }, 500);


    } catch (error) {

        console.error(error);


        showMessage(
            error.message ||
            "Unable to connect to server."
        );


        loginButton.disabled = false;

        loginButton.querySelector("span").textContent =
            "Sign In";

    }

});

</script>


</body>

</html>
